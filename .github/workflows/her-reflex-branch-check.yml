name: Her Reflex Branch Check

on:
  push:
    branches:
      - "feat/her-reflex-v0"

permissions:
  contents: read

jobs:
  reflex-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Biome changed Her files
        run: |
          npx biome check --error-on-warnings \
            packages/her/src/her-core/reflex.ts \
            packages/her/src/her-core/index.ts \
            packages/her/src/extension.ts \
            packages/her/test/reflex.test.ts

      - name: Reflex typecheck
        run: |
          npx tsc --noEmit \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --allowImportingTsExtensions \
            --skipLibCheck \
            --types node \
            packages/her/src/her-core/reflex.ts

      - name: Reflex unit test
        run: node --import tsx --test packages/her/test/reflex.test.ts
