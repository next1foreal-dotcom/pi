name: Her Durable Readonly Probe

on:
  pull_request:
    paths:
      - 'packages/her/experiments/durable-readonly/**'
      - '.github/workflows/her-durable-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-probe:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Real SQLite crash recovery and readonly gates
        run: node packages/her/experiments/durable-readonly/run-isolated.mjs
