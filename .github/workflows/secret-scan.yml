name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan current tree
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --no-git --source . --config .gitleaks.toml --verbose
