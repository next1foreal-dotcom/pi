name: Her Durable Observer Integration
on:
  pull_request:
    paths:
      - packages/her/experiments/durable-readonly/**
      - packages/her/src/her-core/review-evidence.ts
      - packages/her/src/lib/cedar.ts
      - packages/her/src/observer-report/**
      - packages/her/test/observer-report.test.ts
      - .pi/extensions/her-observer.ts
      - packages/her/pi-package/policies/**
      - .github/workflows/her-durable-observer.yml
permissions:
  contents: read
jobs:
  observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Real Her policy, source evidence and recovery
        run: node packages/her/experiments/durable-readonly/run-her-observer.mjs
