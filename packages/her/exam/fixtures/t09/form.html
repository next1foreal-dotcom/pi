<!doctype html><html><body><main id="app"><section id="one"><label>Name <input id="name"></label><label>Email <input id="email"></label><button id="next1">Next</button></section><section id="two" hidden><label>Phone <input id="phone"></label><p id="hint">phone must start with a country code, e.g. +86-...</p><button id="back2">Back</button><button id="next2">Next</button></section><section id="three" hidden><p>Review application</p><button id="back3">Back</button><button id="submit">Submit</button></section></main><script>const one=document.getElementById("one"),two=document.getElementById("two"),three=document.getElementById("three");function show(a,b){a.hidden=true;b.hidden=false}document.getElementById("next1").onclick=()=>show(one,two);document.getElementById("back2").onclick=()=>show(two,one);document.getElementById("next2").onclick=()=>{if(!document.getElementById("phone").value.startsWith("+86-")){document.getElementById("hint").textContent="phone must start with a country code, e.g. +86-...";return}show(two,three)};document.getElementById("back3").onclick=()=>show(three,two);document.getElementById("submit").onclick=()=>{const code=[70,79,82,77,45,79,75,45,55,51,57,49].map(String.fromCharCode).join("");document.getElementById("app").innerHTML="<h1>Success</h1><p>Confirmation: "+code+"</p>"}</script></body></html>
